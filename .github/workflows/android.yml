name: Android APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build both editions
        run: >-
          gradle testClassicDebugUnitTest testConnectedDebugUnitTest :linkautomator:testDebugUnitTest
          assembleClassicDebug assembleConnectedDebug :linkautomator:assembleDebug
          lintClassicDebug lintConnectedDebug :linkautomator:lintDebug --stacktrace

      - name: Print Link Automator lint report
        if: always()
        shell: bash
        run: |
          report="linkautomator/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if test -f "$report"; then cat "$report"; else echo "Lint report not generated"; fi

      - name: Verify Link Automator permission boundary
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find linkautomator/build/intermediates -type f -path '*/debug/processDebugMainManifest/AndroidManifest.xml' -print -quit)"
          test -f "$manifest"
          grep -q 'android.permission.RECEIVE_SMS' "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"
          if grep -qE 'android.permission.(SEND_SMS|READ_SMS|BIND_ACCESSIBILITY_SERVICE|SYSTEM_ALERT_WINDOW)' "$manifest"; then
            echo 'Link Automator requested unexpected privileged permissions' >&2
            exit 1
          fi

      - name: Verify flavor manifest permissions and package IDs
        shell: bash
        run: |
          set -euo pipefail
          classic_manifest="$(find app/build/intermediates -type f -path '*/classicDebug/processClassicDebugMainManifest/AndroidManifest.xml' -print -quit)"
          connected_manifest="$(find app/build/intermediates -type f -path '*/connectedDebug/processConnectedDebugMainManifest/AndroidManifest.xml' -print -quit)"
          test -f "$classic_manifest"
          test -f "$connected_manifest"
          if grep -q 'android.permission.INTERNET' "$classic_manifest"; then
            echo 'Classic manifest unexpectedly requests INTERNET' >&2
            exit 1
          fi
          grep -q 'android.permission.INTERNET' "$connected_manifest"
          if grep -q 'android.permission.READ_SMS' "$classic_manifest" "$connected_manifest"; then
            echo 'An edition unexpectedly requests SMS-history access' >&2
            exit 1
          fi
          grep -q 'android:allowBackup="false"' "$connected_manifest"
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt="$(find "$sdk_dir/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          classic_package="$("$aapt" dump badging app/build/outputs/apk/classic/debug/app-classic-debug.apk | sed -nE "s/^package: name='([^']+)'.*/\1/p" | head -n 1)"
          connected_package="$("$aapt" dump badging app/build/outputs/apk/connected/debug/app-connected-debug.apk | sed -nE "s/^package: name='([^']+)'.*/\1/p" | head -n 1)"
          test "$classic_package" = "com.tahlor.smsforwarder"
          test "$connected_package" = "com.tahlor.smsforwarder.connected"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-code-forwarder-apk
          path: |
            app/build/outputs/apk/classic/debug/app-classic-debug.apk
            app/build/outputs/apk/connected/debug/app-connected-debug.apk
            linkautomator/build/outputs/apk/debug/linkautomator-debug.apk
          if-no-files-found: error
          retention-days: 30
