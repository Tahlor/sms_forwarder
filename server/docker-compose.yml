services:
  sms-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms-bridge
    restart: unless-stopped
    # Safe default: bind ONLY to loopback 127.0.0.1. Place behind an HTTPS reverse proxy (Caddy / Nginx).
    ports:
      - "127.0.0.1:${SMS_BRIDGE_HOST_PORT:-18765}:8765"
    volumes:
      - ./data:/data
    environment:
      - SMS_BRIDGE_HOST=0.0.0.0
      - SMS_BRIDGE_PORT=8765
      - SMS_BRIDGE_DATA_DIR=/data
      - SMS_BRIDGE_DB_PATH=/data/sms_bridge.db
      - SMS_BRIDGE_ADMIN_USER=admin
      # Set a strong admin password or use SMS_BRIDGE_ADMIN_PASSWORD_HASH
      - "SMS_BRIDGE_ADMIN_PASSWORD=${SMS_BRIDGE_ADMIN_PASSWORD:?Set SMS_BRIDGE_ADMIN_PASSWORD in server/.env}"
      - "SMS_BRIDGE_SECRET_KEY=${SMS_BRIDGE_SECRET_KEY:?Set SMS_BRIDGE_SECRET_KEY in server/.env}"
      - "SMS_BRIDGE_PUBLIC_URL=${SMS_BRIDGE_PUBLIC_URL:?Set actual HTTPS URL in server/.env}"
      - SMS_BRIDGE_PAIRING_TTL_SECONDS=600
      - SMS_BRIDGE_SECURE_COOKIE=1
      - SMS_BRIDGE_TRUSTED_PROXY=1
